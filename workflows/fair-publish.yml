name: Publish to FAIR Repository

on:
  workflow_run:
    workflows: ["Upload Release Asset"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (leave empty to use latest tag)'
        required: false
        type: string

permissions:
  contents: read

env:
  PHP_VERSION: '8.3'

jobs:
  publish:
    name: Publish to FAIR Repository
    runs-on: ubuntu-latest
    # Only run if the triggering workflow succeeded (or if manually triggered)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" == "workflow_run" ]; then
            # Get the tag from the workflow run that triggered this
            TAG="${{ github.event.workflow_run.head_branch }}"
            echo "version=${TAG}" >> $GITHUB_OUTPUT
          else
            echo "version=$(git describe --tags --abbrev=0 2>/dev/null || echo '0.0.1')" >> $GITHUB_OUTPUT
          fi

      - name: Publish with FAIR action
        id: fair
        uses: ./
        with:
          version: ${{ steps.version.outputs.version }}
          artifact-name: ${{ github.event.repository.name }}.zip
          upload-metadata: 'true'
          update-did-service: 'true'
        env:
          FAIR_ROTATION_KEY_PRIVATE: ${{ secrets.FAIR_ROTATION_KEY_PRIVATE }}
          FAIR_ROTATION_KEY_PUBLIC: ${{ secrets.FAIR_ROTATION_KEY_PUBLIC }}
          FAIR_VERIFICATION_KEY_PRIVATE: ${{ secrets.FAIR_VERIFICATION_KEY_PRIVATE }}
          FAIR_VERIFICATION_KEY_PUBLIC: ${{ secrets.FAIR_VERIFICATION_KEY_PUBLIC }}
          FAIR_DID: ${{ vars.FAIR_DID }}

      - name: Publish summary
        run: |
          echo "Published version: ${{ steps.fair.outputs.version }}"
          echo "DID: ${{ steps.fair.outputs.did }}"
          echo "Metadata path: ${{ steps.fair.outputs['metadata-path'] }}"

